<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🔐 Login – Thoughts Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>

    body {
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-card {
      width: 360px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    
  </style>
</head>
<body>

  <div class="login-card">
    <h4 class="text-center mb-4">Login to Thoughts Blog</h4>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="text-center mt-3 mb-0">Use demo login:<br><b>emilys / emilyspass</b></p>
  </div>

  <script>
    // Handle login
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        const res = await fetch('https://dummyjson.com/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: username,
            password: password,
            expiresInMins: 30
          })
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.message || "Login failed");

        // Save login data (token + refresh token)
        localStorage.setItem("user", JSON.stringify(data));

        alert(`Welcome ${data.firstName}! Redirecting to home...`);
        window.location.href = "thoughts.html"; // redirect after login
      } catch (err) {
        alert("❌" + err.message);
      }
    });
  </script>
</body>
</html>
