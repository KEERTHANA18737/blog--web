<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title> Thoughts Blog</title>
  <link rel="icon" type="image/png" sizes="32x32" href="seo.png">
<link rel="shortcut icon" href="seo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #fafafa; }
    .card-img-top { height: 180px; object-fit: cover; }
    .spinner-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
    }
    .pagination {
      justify-content: center;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <!-- 🌐 Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary">
        <img src="Screenshot 2025-10-10 145839.png" alt="Logo" style="width:40px;" class="rounded-pill me-2">
        Thoughts Blog
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="thoughts.html">Thoughts</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
       <a href="login.html" class="btn btn-outline-primary me-2">Login</a>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#signupModal">Signup</button>
      </div>
    </div>
  </nav>

  <!-- 🧠 Thoughts Section -->
  <div class="container mt-4">
    <h2 class="text-center mb-4">💭 My Thoughts</h2>

    <!-- Spinner -->
    <div id="spinner" class="spinner-container">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Thoughts list -->
    <div id="thought-section" class="row g-4 d-none"></div>

    <!-- Pagination -->
    <nav>
      <ul id="pagination" class="pagination"></ul>
    </nav>
  </div>

  <footer class="bg-white text-center py-3 mt-5 shadow-sm"> © 2025 Thoughts Blog ❤️🧿</footer>

  <!-- Login Modal -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="loginModalLabel">Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Email address</label>
              <input type="email" class="form-control" id="loginEmail" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="loginPassword" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Signup Modal -->
  <div class="modal fade" id="signupModal" tabindex="-1" aria-labelledby="signupModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="signupModalLabel">Signup</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="signupForm">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" id="signupName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="signupEmail" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="signupPassword" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Create Account</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="constants.js"></script>

  <script>
    const thoughtsContainer = document.getElementById("thought-section");
    const spinner = document.getElementById("spinner");
    const pagination = document.getElementById("pagination");

    let thoughts = [];
    let currentPage = 1;
    const postsPerPage = 3; //  change as you want (3, 6, 9...)

    // ✅ Fetch posts using the base URL
    fetch(`${BASE_URL}/posts`)
      .then(res => res.json())
      .then(data => {
        thoughts = data.slice(0, 100);
        spinner.classList.add("d-none");
        thoughtsContainer.classList.remove("d-none");
        showPage(currentPage);
        setupPagination();
      })
      .catch(() => {
        spinner.innerHTML = `<p class="text-danger text-center"> Failed to load thoughts.</p>`;
      });

    function showPage(page) {
      thoughtsContainer.innerHTML = "";
      const start = (page - 1) * postsPerPage;
      const end = start + postsPerPage;
      const paginatedPosts = thoughts.slice(start, end);

      paginatedPosts.forEach(thought => {
        const randomImage = `https://picsum.photos/400/200?random=${thought.id}`;
        const card = `
          <div class="col-md-4">
            <div class="card h-100 shadow-sm" style="cursor:pointer;" onclick="openDetail(${thought.id})">
              <img src="${randomImage}" class="card-img-top" alt="Thought image">
              <div class="card-body">
                <h5 class="card-title mt-2 text-capitalize">${thought.title}</h5>
                <p class="card-text text-secondary">${thought.body}</p>
              </div>
            </div>
          </div>`;
        thoughtsContainer.innerHTML += card;
      });
    }

    // ✅ Enhanced Pagination with First, Prev, Next, Last
    function setupPagination() {
      const totalPages = Math.ceil(thoughts.length / postsPerPage);
      pagination.innerHTML = "";

      const maxVisiblePages = 5;
      let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
      let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

      if (endPage - startPage < maxVisiblePages - 1) {
        startPage = Math.max(1, endPage - maxVisiblePages + 1);
      }

      // « First
      pagination.innerHTML += `
        <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
          <a class="page-link" href="#" onclick="changePage(1)">&laquo;</a>
        </li>`;

      // ‹ Prev
      pagination.innerHTML += `
        <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
          <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">Prev</a>
        </li>`;

      if (startPage > 1) {
        pagination.innerHTML += `<li class="page-item disabled"><a class="page-link">...</a></li>`;
      }

      for (let i = startPage; i <= endPage; i++) {
        pagination.innerHTML += `
          <li class="page-item ${i === currentPage ? 'active' : ''}">
            <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
          </li>`;
      }

      if (endPage < totalPages) {
        pagination.innerHTML += `<li class="page-item disabled"><a class="page-link">...</a></li>`;
      }

      // › Next
      pagination.innerHTML += `
        <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
          <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">Next</a>
        </li>`;

      // » Last
      pagination.innerHTML += `
        <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
          <a class="page-link" href="#" onclick="changePage(${totalPages})">&raquo;</a>
        </li>`;
    }

    function changePage(page) {
      const totalPages = Math.ceil(thoughts.length / postsPerPage);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      showPage(currentPage);
      setupPagination();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openDetail(id) {
      window.location.href = `thought-detail.html?id=${id}`;
    }

    // ✅ Demo login/signup
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      alert('Login successful (demo only)');
      bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
    });

    document.getElementById('signupForm').addEventListener('submit', function(e){
      e.preventDefault();
      alert('Account created successfully (demo only)');
      bootstrap.Modal.getInstance(document.getElementById('signupModal')).hide();
    });
  </script>
</body>
</html>
